[build]
  command = "npm run build:web"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[build.environment]
  # External-service values are intentionally absent. Each Netlify project must
  # provide explicit environment variables; missing configuration fails closed.
  # Secrets Scanning Configuration - Omit paths containing expected config values
  SECRETS_SCAN_OMIT_PATHS = "R2_SETUP.md,SEO_AUDIT_REPORT.md,plans/**,public/**,web/**,src/config/**,src/components/SEOMetadata.tsx,src/contexts/AuthContext.tsx,src/screens/**,src/services/R2Service.ts,src/services/AnalyticsService.ts,src/services/FirebaseService.ts,src/services/PesaPalService.ts,src/services/PawaPayService.ts,sendNotifications.js,subscribeTokens.js,index.web.js,netlify/functions/append-token.js,netlify/functions/uploadR2.js,netlify/functions/create-pesapal-order.js,netlify/functions/verify-pesapal-payment.js,netlify/functions/process-pesapal-payout.js,netlify/functions/register-ipn.js,netlify/functions/pesapal-ipn.js,netlify/functions/create-pawapay-deposit.js,netlify/functions/verify-pawapay-payment.js,app.json,.gitignore,package.json,package-lock.json"
  # Omit environment variable keys that are public by design or appear in documentation
  # Firebase credentials are public (frontend config)
  # Bucket names and provider URLs are not secrets.
  # R2_PUBLIC_URL, R2_ENDPOINT are URLs (not secrets)
  # FIREBASE_SERVICE_ACCOUNT is required for Firebase Admin operations
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,FIREBASE_PROJECT_ID,FIREBASE_API_KEY,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID,R2_PRIVATE_BUCKET_NAME,R2_PUBLIC_BUCKET_NAME,R2_PUBLIC_URL,R2_ENDPOINT,PESAPAL_API_URL,PESAPAL_BASE_URL,PAWAPAY_API_URL,SITE_URL,APP_ENV,EXPO_NO_DOTENV,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_FUNCTIONS_BASE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_R2_PUBLIC_BUCKET_NAME,NEXT_PUBLIC_R2_PUBLIC_URL,NEXT_PUBLIC_FIREBASE_ENABLED,NEXT_PUBLIC_NOTIFICATIONS_ENABLED,NEXT_PUBLIC_SENTRY_DSN,PESAPAL_NOTIFICATION_ID,IPN_URL,PAWAPAY_SIGNED_CALLBACKS,PAWAPAY_DEPOSIT_CALLBACK_URL,PAWAPAY_PAYOUT_CALLBACK_URL,PAWAPAY_REFUND_CALLBACK_URL,PAWAPAY_CHECKOUT_CALLBACK_URL,TICKET_EMAIL_FROM,PAYOUT_EMAIL_FROM,PAYOUT_CC,STAGING_ALLOWED_EMAILS"

[dev]
  command = "npm run start"

[functions]
  # Tell Netlify where your serverless functions live
  directory = "netlify/functions"
  # Use esbuild to bundle function dependencies (including firebase-admin)
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js", "@resvg/resvg-js-linux-x64-gnu"]

[[edge_functions]]
  function = "staging-gate"
  path = "/*"

[functions."process-stuck-fulfillments"]
  # Automatic retry/reconciliation of stranded purchases every minute.
  schedule = "* * * * *"

[functions."process-ticket-email-queue"]
  # Deliver queued ticket emails independently from ticket creation.
  schedule = "* * * * *"

[functions."purge-expired-photos"]
  # Phase 4 (4.3): daily photo/QR retention purge at 04:00
  schedule = "0 4 * * *"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/refund-request"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  # Cache TensorFlow.js model files for 1 year
  for = "/vibe_model_tfjs/model.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Content-Type = "application/json"

[[headers]]
  # Cache TensorFlow.js weight files for 1 year
  for = "/vibe_model_tfjs/*.bin"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000"
    Content-Type = "application/octet-stream"

[[redirects]]
  from = "/staging-diagnostics/pawapay-provider-config"
  to = "/.netlify/functions/pawapay-active-config"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  guess = true
  paths = [
    "/",
    "/events",
    "/venues",
    "/map",
    "/calendar",
    "/events/parties",
    "/events/concerts",
    "/events/dj-nights",
    "/events/live-music",
    "/events/this-weekend",
    "/venues/clubs",
    "/venues/bars",
    "/venues/lounges",
    "/venues/rooftops",
    "/kampala",
    "/entebbe",
    "/jinja"
  ]
